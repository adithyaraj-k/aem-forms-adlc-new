# Scope: TEST PLAN ONLY — no JUnit/Selenium/Cypress code. Cases feed create-form-tests (P10),
#        test-form-ui (P13), and the Sentinel TEST lead (functional/e2e).
# Executors: create-form-tests = unit/integration JUnit; test-form-ui = visual parity;
#            sentinel = e2e/functional validation on the deployed form.

test_cases:
  forms:
    - key: "vehicle-registration-form"
      reference_for_ui_check: "c:\\Users\\330073\\Downloads\\Vehicle Reg.jpg"
      cases:

        # =========================================================================
        # US-01 — Owner personal identifying details (Full Name, DOB, Gender)
        # =========================================================================
        - id: TC-001
          title: "Full Name is required and blocks submit when empty"
          category: field_validation
          level: e2e
          target: fullName
          preconditions: "form loaded"
          steps: ["leave Full Name empty", "fill all other required fields", "click Submit"]
          expected: "Submit blocked; mandatory message shown on Full Name; form not submitted"
          executes_with: sentinel
          traces_to_story: US-01
          traces_to_ac: AC-01.1
        - id: TC-002
          title: "Full Name accepts valid input up to max length and has aria-label"
          category: field_validation
          level: e2e
          target: fullName
          preconditions: "form loaded"
          steps: ["enter a valid name (<=100 chars)", "inspect aria-label = 'Full Name'"]
          expected: "value accepted; aria-label 'Full Name' present"
          executes_with: sentinel
          traces_to_story: US-01
          traces_to_ac: AC-01.1
        - id: TC-003
          title: "Date of Birth enforces DD/MM/YYYY, valid date, not in the future"
          category: field_validation
          level: e2e
          target: dateOfBirth
          preconditions: "form loaded"
          steps: ["enter a future date", "enter an invalid date (32/13/2000)", "enter a valid past date"]
          expected: "future date rejected; invalid date rejected; valid past date accepted; format DD/MM/YYYY; aria-label 'Date of Birth'"
          executes_with: sentinel
          traces_to_story: US-01
          traces_to_ac: AC-01.2
        - id: TC-004
          title: "validateDateDDMMYYYY + validateDobNotFuture clientlib functions (unit)"
          category: field_validation
          level: unit
          target: "clientlib: validateDateDDMMYYYY, validateDobNotFuture"
          preconditions: "clientlib functions available"
          steps: ["assert valid DD/MM/YYYY passes", "assert malformed date fails", "assert future date fails DOB check", "assert empty is safe (no ReferenceError)"]
          expected: "functions return correct boolean; empty-safe; no exceptions"
          executes_with: create-form-tests
          traces_to_story: US-01
          traces_to_ac: AC-01.2
        - id: TC-005
          title: "Gender radio group is required and offers exactly Male/Female/Other"
          category: field_validation
          level: e2e
          target: gender
          preconditions: "form loaded"
          steps: ["inspect options", "submit without selecting", "select one option"]
          expected: "exactly Male, Female, Other via enum/enumNames; required blocks submit when none selected; aria-label 'Gender'"
          executes_with: sentinel
          traces_to_story: US-01
          traces_to_ac: AC-01.3

