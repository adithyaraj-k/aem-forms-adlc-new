# DESI — Test Design · design-form-tests
# Vehicle Registration Form · runId 2026-07-01-vehicle-registration-form
# Produced by: Design forge (DESI) › Test Design
# Inputs: PLAN-discover-form-requirements.yaml (US-01..US-13 + AC-*), PLAN-architect-form-solution.yaml,
