gaps:
  - id: "GAP-01"
    description: "Schema must nest address/declaration fields as $.address.* / $.declaration.* objects (not flat) to match the reused fragments' canonical dataRef paths — differs from the flat-schema assumption in the PLAN's solution-architecture.yaml fields_coverage list."
    owner_phase: "generate-schema (Phase 1) + create-adaptive-form (Phase 3)"
  - id: "GAP-02"
    description: "address-details-fragment's pincode pattern (^[0-9]+$, maxLength 12) does not enforce this form's exact-6-digit R15 rule; a supplemental form-scoped validation rule must be layered on top via create-form-rules without editing the shared fragment."
    owner_phase: "create-form-rules (Phase 4)"
  - id: "GAP-03"
    description: "declaration-fragment's date field has no built-in default value or max-date-today constraint; this form's R20 (defaults to today, no future date) must be added as a supplemental form-scoped rule via create-form-rules without editing the shared fragment."
    owner_phase: "create-form-rules (Phase 4)"
  - id: "GAP-04"
    description: "declaration-fragment does not include the static legal text; it must be authored inline in the consuming form directly above the fragment embed (fragment carries fields only, not form-specific copy)."
    owner_phase: "create-adaptive-form (Phase 3)"
