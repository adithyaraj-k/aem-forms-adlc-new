test_cases:
  brief: "Vehicle Registration Form — Test cases covering all requirements, user stories, and acceptance criteria"
  form_key: "vehicle-registration-form"
  total_user_stories: 10
  total_acceptance_criteria: 44

  cases:
    # ========== SECTION 1: OWNER DETAILS (6 fields)
    # US-01: Owner provides identifying details (ownerFullName, dateOfBirth, gender)
    - id: "TC-01-001"
      title: "Owner Full Name is required and limited to 100 characters"
      category: "field_validation"
      level: "ui-visual"
      target_field: "ownerFullName"
      target_rule: "R01"
      preconditions: "Form loaded; focus on Owner Full Name field"
      steps:
        - "Leave Owner Full Name empty"
        - "Tab to next field (triggers blur validation)"
        - "Verify error message"
        - "Enter text with 101 characters"
        - "Verify error at max length boundary"
      expected_result: |
        - Empty: mandatory error message displayed inline (red text)
        - 100 chars: accepted, no error
        - 101 chars: error "Owner Full Name must not exceed 100 characters"
      executes_with: "test-form-ui"
      traces_to_story: "US-01"
      traces_to_ac: "AC-01.1"

    - id: "TC-01-002"
      title: "Date of Birth cannot be future date and optionally enforces 18+ years"
      category: "field_validation"
      level: "ui-visual"
      target_field: "dateOfBirth"
      target_rule: "R02"
      preconditions: "Form loaded; focus on Date of Birth field"
      steps:
        - "Enter today's date + 1 day (future)"
        - "Tab to next field (triggers validation)"
        - "Verify error message"
        - "Enter a date less than 18 years ago (e.g., 5 years ago)"
        - "Verify error for underage (if 18+ enforcement enabled)"
        - "Enter a valid past date >= 18 years ago"
        - "Verify no error"
      expected_result: |
        - Future date: error "Date of Birth cannot be in the future"
        - Age < 18: error "You must be at least 18 years old"
        - Valid date (>= 18 yrs ago): accepted, no error
      executes_with: "test-form-ui"
      traces_to_story: "US-01"
      traces_to_ac: "AC-01.2"

    - id: "TC-01-003"
      title: "Date of Birth defaults to DD/MM/YYYY format and accepts valid dates"
      category: "field_validation"
      level: "ui-visual"
      target_field: "dateOfBirth"
      target_rule: "R02"
      preconditions: "Form loaded; Date of Birth field visible with calendar icon"
      steps:
        - "Click calendar icon on Date of Birth field"
        - "Verify date picker opens with DD/MM/YYYY format"
        - "Select a valid past date (e.g., 01/01/2000)"
        - "Verify date appears in field as DD/MM/YYYY"
      expected_result: |
        - Calendar icon visible
        - Date picker shows DD/MM/YYYY format
        - Selected date populates field correctly
      executes_with: "test-form-ui"
      traces_to_story: "US-01"
      traces_to_ac: "AC-01.3"

    - id: "TC-01-004"
      title: "Gender dropdown is required and offers Male, Female, Other"
      category: "field_validation"
      level: "ui-visual"
      target_field: "gender"
      target_rule: "R03"
      preconditions: "Form loaded; Gender dropdown visible with 'Select' placeholder"
      steps:
        - "Leave Gender unselected"
        - "Click Submit (triggers form-level validation)"
        - "Verify mandatory error on Gender"
        - "Click Gender dropdown"
        - "Verify options: Male, Female, Other appear"
        - "Select 'Male'"
        - "Verify selection persists; error clears"
      expected_result: |
        - Unselected: mandatory error displayed
        - Dropdown shows exactly 3 options: Male, Female, Other
        - Selection updates field and clears error
      executes_with: "test-form-ui"
      traces_to_story: "US-01"
      traces_to_ac: "AC-01.4"

    # US-02: Owner provides contact information (contactNumber, emailAddress, emergencyContactNo)
    - id: "TC-02-001"
      title: "Contact Number accepts 10-digit numeric input only"
      category: "field_validation"
      level: "ui-visual"
      target_field: "contactNumber"
      target_rule: "R04"
      preconditions: "Form loaded; focus on Contact Number field"
      steps:
        - "Enter 9 digits (e.g., 123456789)"
        - "Tab to next field"
        - "Verify error message"
        - "Clear field and enter 10 letters (e.g., ABCDEFGHIJ)"
        - "Verify error (non-numeric)"
        - "Enter exactly 10 digits (e.g., 9876543210)"
        - "Verify no error"
      expected_result: |
        - 9 digits: error "Contact number must be 10 digits"
        - Letters/special chars: error "Contact number must be 10 digits"
        - 10 digits exactly: accepted, no error
      executes_with: "test-form-ui"
      traces_to_story: "US-02"
      traces_to_ac: "AC-02.1"

    - id: "TC-02-002"
      title: "Contact Number error message displays correctly on validation failure"
      category: "field_validation"
      level: "ui-visual"
      target_field: "contactNumber"
      target_rule: "R04"
      preconditions: "Contact Number field with invalid value"
      steps:
        - "Enter invalid contact number (9 digits)"
        - "Tab out to trigger validation"
        - "Verify error text 'Contact number must be 10 digits.' appears inline below field in red"
      expected_result: |
        - Error message is visible, text is red (#d32f2f), positioned below the field
      executes_with: "test-form-ui"
      traces_to_story: "US-02"
      traces_to_ac: "AC-02.2"

    - id: "TC-02-003"
      title: "Email Address validates RFC 5322 format"
      category: "field_validation"
      level: "ui-visual"
      target_field: "emailAddress"
      target_rule: "R05"
      preconditions: "Form loaded; focus on Email Address field"
      steps:
        - "Enter invalid email (e.g., 'notanemail')"
        - "Tab to next field"
        - "Verify error message"
        - "Enter missing domain (e.g., 'user@')"
        - "Verify error"
        - "Enter valid RFC 5322 email (e.g., 'john.doe+tag@example.co.uk')"
        - "Verify no error"
      expected_result: |
        - Invalid formats: error "Please enter a valid email address"
        - Valid RFC 5322 format: accepted, no error
      executes_with: "test-form-ui"
      traces_to_story: "US-02"
      traces_to_ac: "AC-02.3"

    - id: "TC-02-004"
      title: "Email Address error message displays correctly"
      category: "field_validation"
      level: "ui-visual"
      target_field: "emailAddress"
      target_rule: "R05"
      preconditions: "Email Address field with invalid value"
      steps:
        - "Enter invalid email"
        - "Tab out to trigger validation"
        - "Verify error text 'Please enter a valid email address.' appears inline in red"
      expected_result: |
        - Error message visible, red color, below field
      executes_with: "test-form-ui"
      traces_to_story: "US-02"
      traces_to_ac: "AC-02.4"

    - id: "TC-02-005"
      title: "Emergency Contact No. accepts 10-digit numeric input only"
      category: "field_validation"
      level: "ui-visual"
      target_field: "emergencyContactNo"
      target_rule: "R06"
      preconditions: "Form loaded; focus on Emergency Contact No. field"
      steps:
        - "Enter 11 digits"
        - "Tab to next field"
        - "Verify error"
        - "Enter exactly 10 digits"
        - "Verify no error"
      expected_result: |
        - 11 digits or non-numeric: error "Contact number must be 10 digits"
        - 10 digits: accepted
      executes_with: "test-form-ui"
      traces_to_story: "US-02"
      traces_to_ac: "AC-02.5"

    - id: "TC-02-006"
      title: "Emergency Contact No. error message displays correctly"
      category: "field_validation"
      level: "ui-visual"
      target_field: "emergencyContactNo"
      target_rule: "R06"
      preconditions: "Emergency Contact No. field with invalid value"
      steps:
        - "Enter invalid emergency contact"
        - "Trigger validation"
        - "Verify error text 'Contact number must be 10 digits.' in red below field"
      expected_result: |
        - Error message visible and in red color
      executes_with: "test-form-ui"
      traces_to_story: "US-02"
      traces_to_ac: "AC-02.6"

