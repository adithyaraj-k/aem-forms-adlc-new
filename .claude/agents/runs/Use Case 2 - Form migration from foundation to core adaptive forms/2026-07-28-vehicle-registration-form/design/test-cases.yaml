    # ========== SUBMIT & RESET BUTTONS
    # US-08: Owner submits the completed form
    - id: "TC-08-001"
      title: "Submit Form button is visible and styled with solid green/teal background and white text"
      category: "button"
      level: "ui-visual"
      target_field: "submit_button"
      target_rule: "—"
      preconditions: "Form loaded; scrolled to bottom (button area)"
      steps:
        - "Scroll to form footer"
        - "Verify Submit Form button is visible"
        - "Verify button has solid green/teal background (#228B22 or similar)"
        - "Verify button text is white"
        - "Verify button has standard padding and border radius"
      expected_result: |
        - Button visible, label: "Submit Form"
        - Background color: green/teal (#228B22)
        - Text color: white (#ffffff)
        - Border radius: 4px
      executes_with: "test-form-ui"
      traces_to_story: "US-08"
      traces_to_ac: "AC-08.1"

    - id: "TC-08-002"
      title: "Submit button is disabled or shows validation errors if required fields are empty"
      category: "submit"
      level: "e2e"
      target_field: "submit_button"
      target_rule: "—"
      preconditions: "Form loaded with required fields empty"
      steps:
        - "Leave all required fields empty"
        - "Click Submit Form button"
        - "Verify form submission is blocked"
        - "Verify inline validation error messages appear on all empty required fields"
        - "Verify first empty required field receives focus"
      expected_result: |
        - Submit blocked; no request sent
        - All required fields show mandatory error messages (red text, below field)
        - First invalid field focused (keyboard accessible)
        - No PDF generated
      executes_with: "sentinel"
      traces_to_story: "US-08"
      traces_to_ac: "AC-08.2"

    - id: "TC-08-003"
      title: "Clicking Submit with valid form generates PDF/Document of Record with all data"
      category: "submit"
      level: "integration"
      target_field: "submit_button"
      target_rule: "—"
      preconditions: "Form loaded with all required fields filled with valid data"
      steps:
        - "Fill all required fields with valid data"
